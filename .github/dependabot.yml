# Weekly grouped dependency updates (plan Appendix A). Security alerts and security updates
# are switched on in GitHub → Settings → Code security (see docs/phase-0-report.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
